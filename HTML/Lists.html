<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lists</title>
</head>
<body>
<!-- Unordered List - bullets or dashes -->
<ul>
    <li>Charmander</li>
    <li>Squirtle</li>
    <li>Bulbasaur</li>
    <li>Cyndaquil</li>
    <li>Todadile</li>
    <li>Chikorita</li>
</ul>

<!-- Ordered List - numbered-->
<ol>
    <li>Charmander</li>
    <li>Squirtle</li>
    <li>Bulbasaur</li>
    <li>Cyndaquil</li>
    <li>Todadile</li>
    <li>Chikorita</li>
</ol>

<!-- Descriptive Lists - Make your own heading! -->
<dl>
    <dt>Coffee</dt>
    <dd>Black hot drink</dd>
    <dd>Add creamer and sweet and low</dd>
    <dd>Don't drink too close to bedtime.</dd>
    <dt>Milk</dt>
    <dd>White cold drink</dd>
</dl>


</body>
</html>
